[project]
name = "briefly-ai"
version = "0.1.0"
description = "办公 AI Agent：文档总结、会议纪要、周报、待办、文本优化"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.4,<2",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.7,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-text-splitters>=1.1,<2",
    "sqlalchemy>=2.0,<3",
    "python-dotenv>=1.0",
    "docling-slim[format-docx]>=2.137,<3",
    "openpyxl>=3.1,<4",
    "fastapi>=0.143,<1",
    "uvicorn>=0.54,<1",
    "python-multipart>=0.0.32,<1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28,<1"]

[project.scripts]
briefly = "briefly.cli:main"
briefly-api = "briefly.api:serve"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
briefly = ["prompts/*.md"]
