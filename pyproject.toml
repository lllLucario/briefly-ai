[project]
name = "briefly-ai"
version = "0.1.0"
description = "办公 AI Agent：文档总结、会议纪要、周报、待办、文本优化"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.4,<2",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.7,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
briefly = "briefly.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
briefly = ["prompts/*.md"]
