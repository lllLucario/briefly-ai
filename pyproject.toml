[project]
name = "briefly-ai"
version = "0.1.0"
description = "办公 AI Agent：文档总结、会议纪要、周报、待办、文本优化"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.4,<2",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.7,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-text-splitters>=1.1,<2",
    "sqlalchemy>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "docling-slim[format-docx,format-pptx]>=2.137,<3",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0.1,<2.1",  # 旧版 .xls 直接读取（BSD）；失败才走 LibreOffice 转换
    "fastapi>=0.143,<1",
    "uvicorn>=0.54,<1",
    "python-multipart>=0.0.32,<1",
    "pypdf>=4.0,<7",
    "pdfplumber>=0.11.10,<0.12",  # PDF 文字行按字符坐标提取、带框线表格识别
    "pypdfium2>=5.9,<6",  # PDF 页面渲染：判断表格边上的文字是否可见、从图片里找表格框线
    "numpy>=2.0,<3",  # 渲染图的像素运算
    "tzdata>=2024.1,<2028",  # Windows 下 zoneinfo 需要（每日扫描的时区）
    "httpx>=0.28,<1",  # 飞书开放平台 REST
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "xlwt>=1.3,<1.4"]  # xlwt 只在测试里构造 .xls 样本
browser = ["playwright>=1.64,<2"]
rag = ["fastembed>=0.9.1,<0.10", "sqlite-vec>=0.1.9,<0.2", "psutil>=7.2,<8"]
# 本地图片文字识别（Apache-2.0；ONNX Runtime CPU 推理，PP-OCRv6 small 模型随包分发，不联网下载）
ocr = ["rapidocr>=3.10,<3.11", "onnxruntime>=1.20,<2"]

[project.scripts]
briefly = "briefly.cli:main"
briefly-api = "briefly.api:serve"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
briefly = ["prompts/*.md", "web/*", "web/vendor/*", "java/*.java", "java/*.jar", "java/*.json"]

[tool.uv]
# 锁文件只解 CI 和开发实际使用的环境（Python 3.14 的 Linux、Windows），不改变 requires-python 声明。
# 更新方法见 README“锁定依赖”。
environments = [
    "python_version >= '3.14' and sys_platform == 'linux'",
    "python_version >= '3.14' and sys_platform == 'win32'",
]
# 这两个平台必须有可直接安装的 wheel，否则 uv lock 直接失败
required-environments = [
    "python_version >= '3.14' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "python_version >= '3.14' and sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: 本机浏览器回归，使用 --run-browser 显式运行，不调用真实模型"]
